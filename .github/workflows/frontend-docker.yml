name: Frontend Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_VERSION: 0.2.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set build metadata
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV" # frontend image suffix

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend # frontend build context
          file: frontend/Dockerfile # explicit frontend Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            EXPO_PUBLIC_API_BASE=https://vocabuai.fryy.de/api
            APP_VERSION=${{ env.APP_VERSION }}
            APP_COMMIT_SHA=${{ env.SHORT_SHA }}
            APP_BUILD_TIME_UTC=${{ env.BUILD_TIME_UTC }}
            APP_BRANCH=${{ github.ref_name }}
