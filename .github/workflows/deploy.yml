
  name: Deploy

  on:
    push:
      branches: [main]

  env:
    REGISTRY: ghcr.io
    APP_VERSION: 0.2.1

  jobs:
    deploy:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - uses: actions/checkout@v4

        - name: Set build metadata
          run: |
            echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "BUILD_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

        - name: Set image name (lowercase)
          run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

        - uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            build-args: |
              APP_VERSION=${{ env.APP_VERSION }}
              APP_COMMIT_SHA=${{ env.SHORT_SHA }}
              APP_BUILD_TIME_UTC=${{ env.BUILD_TIME_UTC }}
              APP_BRANCH=${{ github.ref_name }}

        - name: Deploy
          run: |
            curl -X POST "${{ vars.DEPLOY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"token\":\"${{ secrets.DEPLOY_TOKEN }}\"}" \
              --fail-with-body
